# Text of the "Live trackers" section (template: _includes/trackers.md, code: assets/trackers.js).
# One block per language. Paragraphs are markdown. An empty string hides that paragraph.
# The LIFT paragraphs are the text published before 16 November 2026, unchanged.
# us_values / lift_values are the figures printed if the live read fails; the page replaces them on load.

en:
  intro: "Two of the review's findings can be followed as they unfold."
  h_us: "Use at work: United States"
  us_para: ""
  us_card_any: "of US adults aged 18 to 64 use generative AI"
  us_card_work: "of employed adults use it for work"
  us_card_hours: "of all work hours are spent using it"
  us_card_saved: "of all work hours are saved by it"
  us_delta: " pts in a year"
  us_values:
    any: "60.8%"
    work: "40.5%"
    hours: "5.3%"
    saved: "2.1%"
    d_any: "+6.3"
    d_work: "+3.2"
    d_hours: "−0.4"
    d_saved: "+0.3"
  us_note_static: "Survey wave of August 2026, as published on 16 November 2026; live refresh pending."
  us_note_live: "Survey wave of {wave}. Figures read from the tracker's data files on {date}; the survey runs about every three months."
  us_details: "All survey waves"
  us_th:
    - "Survey wave"
    - "Any use, adults 18 to 64"
    - "Use for work, employed"
    - "Work hours using it"
    - "Work hours saved"
  us_subgroups: ""
  us_sources: "Sources: Project on Workforce at Harvard, Alexander Bick and Adam Blandin, [GenAI Adoption Tracker](https://www.genaiadoptiontracker.com/), data from the Real-Time Population Survey; Bick, Alexander, Adam Blandin and David J. Deming. 2026. \"The Rapid Adoption of Generative AI.\" *Management Science*. [Link](https://doi.org/10.1287/mnsc.2025.02523)."
  h_fr: "AI skills in job postings: France"
  lift_para: "The hiring margin, where the review finds the clearest effect (section [\"Exposure designs: hiring and entry\"](#exposure-designs-hiring-and-entry)), shows up first in job postings. The Laboratoire de l'Innovation et du Futur du Travail (LIFT, HEC Paris), led by Antonin Bergeaud, publishes a quarterly dashboard of AI in French job postings, built from the Dares JOCAS database, which collects online job postings in France, with postings classified as AI or generative AI by machine learning (Delbouve and Bergeaud; companion paper Aghion, Bergeaud, Bunel and Delbouve 2025). The headline figures below are read live from the tracker's data file each time this page loads."
  lift_cards:
    - "AI job postings since January 2019"
    - "Generative AI job postings"
    - "Firms that have posted an AI job"
    - "Firms that have posted a generative AI job"
  lift_values:
    - "78,005"
    - "4,576"
    - "3,301"
    - "464"
  lift_deltas:
    - "3,515"
    - "705"
  lift_delta: " in the last full quarter"
  lift_note_static: "Postings: LIFT’s monthly series, January 2019 to October 2025 (last full quarter: Q3 2025), read on 22 November 2026. Firms: LIFT’s headline file."
  lift_note_live: "Postings: LIFT’s monthly series, January 2019 to {end} (last full quarter: {quarter}), read on {date}. Firms: LIFT’s headline file. LIFT’s headline posting counts (104,935 in total; 652 and 111 in the last quarter) do not match its own monthly series, so the posting cards use the series."
  lift_trend: "In the tracker's monthly series, postings asking for generative AI skills rose from 83 in 2022 to 356 in 2023, 1,651 in 2024 and 2,434 in the first ten months of 2025. Postings for traditional AI skills (machine learning, without the generative, vision and language categories) fell from 11,895 in 2022 to 7,946 in 2023, then recovered to 9,652 in the first ten months of 2025. Generative AI is still a small part of AI hiring: about one posting in five in 2025, against one in 150 in 2022. These are counts of postings that ask for AI skills, so they track the demand for AI specialists, not the effect of AI on other jobs. The latest monthly observation is October 2025, and the dashboard's headline counts do not match the sum of its monthly series, so the cards above use the series. The relative fall in young hires in exposed occupations reported by Bergeaud, Bertheau, et al. (2026) comes from a different source, the Dares register of hires and contract ends, and is not shown in this tracker."
  lift_details: "LIFT dashboard"
  lift_iframe_title: "LIFT tracker: AI diffusion in French job postings"
  lift_embed_note: "Embedded from LIFT. <a href=\"https://heclift.github.io/website/en/ai-trackers/diffusion-emploi/index.html\">Open the tracker in its own page</a> for the sector, firm size, occupation, skills and map tabs, each with a CSV download."
  lift_other: "For the growth side of the review, LIFT also keeps an [AI diffusion in science and patents tracker](https://heclift.github.io/website/en/ai-trackers/diffusion-science/index.html) (European Patent Office patents citing AI research and AI publications, from REGPAT, OpenAlex and patCit, updated yearly) and a [long run productivity tracker](https://heclift.github.io/website/en/innovation-data/productivite/index.html) (GDP per head, hourly productivity and total factor productivity for 24 economies since 1890, from the Bergeaud, Cette and Lecat Long Term Productivity Database, version 2.7). The productivity series stop in 2024, before any effect of generative AI could appear."
  lift_sources: "Sources: LIFT, [AI diffusion (jobs) tracker](https://heclift.github.io/website/en/ai-trackers/diffusion-emploi/index.html), developed by Paul Delbouve (Collège de France, PSE, DGE) and Antonin Bergeaud (HEC Paris, LSE, CEPR), data updated quarterly; Aghion, Philippe, Antonin Bergeaud, Simon Bunel and Paul Delbouve. 2025. \"Diffusion de l'Intelligence Artificielle en France.\" LIFT Working Paper 2025-01, 10 July, forthcoming in *Économie et Statistique / Economics and Statistics*. [Link](https://heclift.github.io/website/pubs/ai-tracker/)."

fr:
  intro: "Deux des résultats de la revue peuvent être suivis au fil de l'eau."
  h_us: "Usage au travail : États-Unis"
  us_para: ""
  us_card_any: "des adultes américains de 18 à 64 ans utilisent l'IA générative"
  us_card_work: "des personnes en emploi l'utilisent pour leur travail"
  us_card_hours: "des heures travaillées se font avec l'IA générative"
  us_card_saved: "des heures travaillées sont économisées grâce à elle"
  us_delta: " pt en un an"
  us_values:
    any: "60,8 %"
    work: "40,5 %"
    hours: "5,3 %"
    saved: "2,1 %"
    d_any: "+6,3"
    d_work: "+3,2"
    d_hours: "−0,4"
    d_saved: "+0,3"
  us_note_static: "Vague d'enquête d'août 2026, chiffres publiés au 16 novembre 2026 ; actualisation en direct en attente."
  us_note_live: "Vague d'enquête : {wave}. Chiffres lus dans les fichiers de données du tracker le {date} ; l'enquête a lieu environ tous les trois mois."
  us_details: "Toutes les vagues d'enquête"
  us_th:
    - "Vague d'enquête"
    - "Tout usage, adultes de 18 à 64 ans"
    - "Usage au travail, personnes en emploi"
    - "Heures travaillées avec l'IA"
    - "Heures travaillées économisées"
  us_subgroups: ""
  us_sources: "Sources : Project on Workforce at Harvard, Alexander Bick et Adam Blandin, [GenAI Adoption Tracker](https://www.genaiadoptiontracker.com/), données du Real-Time Population Survey ; Bick, Alexander, Adam Blandin et David J. Deming. 2026. \"The Rapid Adoption of Generative AI.\" *Management Science*. [Lien](https://doi.org/10.1287/mnsc.2025.02523)."
  h_fr: "Compétences en IA dans les offres d'emploi : France"
  lift_para: "La marge des embauches, où la revue trouve l'effet le plus net (section [« Dispositifs d'exposition : embauches et entrée »](#exposure-designs-hiring-and-entry)), apparaît d'abord dans les offres d'emploi. Le Laboratoire de l'Innovation et du Futur du Travail (LIFT, HEC Paris), dirigé par Antonin Bergeaud, publie un tableau de bord trimestriel de l'IA dans les offres d'emploi françaises, construit à partir de la base JOCAS de la Dares, qui collecte les offres d'emploi en ligne en France, les offres étant classées comme IA ou IA générative par apprentissage automatique (Delbouve et Bergeaud ; article compagnon Aghion, Bergeaud, Bunel et Delbouve 2025). Les chiffres clés ci-dessous sont lus en direct dans le fichier de données du tracker à chaque chargement de cette page."
  lift_cards:
    - "Offres d'emploi IA depuis janvier 2019"
    - "Offres d'emploi IA générative"
    - "Entreprises ayant publié une offre IA"
    - "Entreprises ayant publié une offre IA générative"
  lift_values:
    - "78 005"
    - "4 576"
    - "3 301"
    - "464"
  lift_deltas:
    - "3 515"
    - "705"
  lift_delta: " au dernier trimestre complet"
  lift_note_static: "Offres : série mensuelle de LIFT, de janvier 2019 à octobre 2025 (dernier trimestre complet : 3e trimestre 2025), lue le 22 novembre 2026. Entreprises : fichier de synthèse de LIFT."
  lift_note_live: "Offres : série mensuelle de LIFT, de janvier 2019 à {end} (dernier trimestre complet : {quarter}), lue le {date}. Entreprises : fichier de synthèse de LIFT. Les totaux d’offres de ce fichier de synthèse (104 935 au total ; 652 et 111 au dernier trimestre) ne concordent pas avec la série mensuelle de LIFT : les cartes d’offres reprennent la série."
  lift_trend: "Dans les séries mensuelles du tracker, les offres demandant des compétences en IA générative sont passées de 83 en 2022 à 356 en 2023, 1,651 en 2024 et 2,434 sur les dix premiers mois de 2025. Les offres de compétences en IA traditionnelle (apprentissage automatique, hors catégories générative, vision et langage) ont chuté de 11,895 en 2022 à 7,946 en 2023, puis sont remontées à 9,652 sur les dix premiers mois de 2025. L'IA générative reste une petite partie des embauches en IA : environ une offre sur cinq en 2025, contre une sur 150 en 2022. Il s'agit de décomptes d'offres demandant des compétences en IA, qui suivent donc la demande de spécialistes de l'IA, et non l'effet de l'IA sur les autres emplois. La dernière observation mensuelle est octobre 2025, et les totaux du tableau de bord ne concordent pas avec la somme de ses séries mensuelles : les cartes ci-dessus reprennent la série. La baisse relative des embauches de jeunes dans les professions exposées rapportée par Bergeaud, Bertheau, et al. (2026) provient d'une autre source, le registre des embauches et des fins de contrat de la Dares, et n'apparaît pas dans ce tracker."
  lift_details: "Tableau de bord LIFT"
  lift_iframe_title: "Tracker LIFT : diffusion de l'IA dans les offres d'emploi françaises"
  lift_embed_note: "Intégré depuis LIFT. <a href=\"https://heclift.github.io/website/en/ai-trackers/diffusion-emploi/index.html\">Ouvrir le tracker dans sa propre page</a> pour les onglets secteur, taille d'entreprise, profession, compétences et carte, chacun avec un téléchargement CSV."
  lift_other: "Pour le volet croissance de la revue, LIFT tient aussi un [tracker de la diffusion de l'IA dans la science et les brevets](https://heclift.github.io/website/en/ai-trackers/diffusion-science/index.html) (brevets de l'Office européen des brevets citant la recherche en IA et publications en IA, à partir de REGPAT, OpenAlex et patCit, mis à jour chaque année) et un [tracker de la productivité de long terme](https://heclift.github.io/website/en/innovation-data/productivite/index.html) (PIB par habitant, productivité horaire et productivité globale des facteurs pour 24 économies depuis 1890, à partir de la Long Term Productivity Database de Bergeaud, Cette et Lecat, version 2.7). Les séries de productivité s'arrêtent en 2024, avant qu'un quelconque effet de l'IA générative ait pu apparaître."
  lift_sources: "Sources : LIFT, [tracker de la diffusion de l'IA (emploi)](https://heclift.github.io/website/en/ai-trackers/diffusion-emploi/index.html), développé par Paul Delbouve (Collège de France, PSE, DGE) et Antonin Bergeaud (HEC Paris, LSE, CEPR), données mises à jour chaque trimestre ; Aghion, Philippe, Antonin Bergeaud, Simon Bunel et Paul Delbouve. 2025. \"Diffusion de l'Intelligence Artificielle en France.\" LIFT Working Paper 2025-01, 10 juillet, à paraître dans *Économie et Statistique / Economics and Statistics*. [Lien](https://heclift.github.io/website/pubs/ai-tracker/)."
