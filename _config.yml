title: "Gen-AI, Jobs and Growth: A Living Review"
description: "A living review of the causal evidence on generative AI and employment, with new papers on AI, labour markets and growth added every week."
author: Adrien Joly
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  toc_levels: "2"
  auto_ids: true
  hard_wrap: false
exclude: [scripts, README.md]
# Email list, self-hosted. Set subscribe_api to EITHER the Apps Script web app URL (infra/subscribe-apps-script; list in a Google
# Sheet, sent by Gmail; https://script.google.com/macros/s/.../exec) OR the Cloudflare Worker URL (infra/subscribe-worker; own
# domain, Resend relay). Alternative: buttondown_username.
# With neither, the sign-up form composes an email to subscribe_email.
subscribe_api: "https://script.google.com/macros/s/AKfycbzpRkretBKp8XvklIRpVjHGefOy2DOHgDtCHaLlRnRBfVcF31RYwTNTkBP0INEdVWvl/exec"
buttondown_username: ""
subscribe_email: "a.p.joly@lse.ac.uk"
include: [emails]
